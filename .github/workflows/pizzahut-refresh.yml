name: Pizza Hut UAE public menu refresh

on:
  schedule:
    - cron: "0 8,20 * * *"
      timezone: "Asia/Dubai"
  workflow_dispatch:

concurrency:
  group: pizzahut-public-menu-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install collection dependencies
        run: python -m pip install -r requirements.txt
      - name: Check persistent database configuration
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Repository secret DATABASE_URL must be configured before collection can run."
            exit 2
          fi
      - name: Collect public Pizza Hut UAE menu
        run: python -m src.jobs.refresh_pizzahut
